[project]
name = "spiraldb-nemo-curator"
version = "0.1.0"
description = "SpiralDB-backed I/O endpoints (VideoReader, ClipWriter) for NeMo Curator video pipelines"
readme = "README.md"
authors = [
    { name = "Andrew Duffy", email = "andrew@spiraldb.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyspiral>=0.13.9",
    "nemo-curator",
    "pyarrow",
    "loguru",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
